# Site da Tráfego Pro (container trafego_pro na porta 3200 local).
# O DNS de trafego.pro aponta para a VPS desde 2026-09-24. O HTTPS dos domínios
# foi emitido com: certbot --nginx -d www.trafego.pro -d trafego.pro
# (o certbot acrescenta os blocos listen 443/ssl e o redirecionamento no servidor).
server {
    listen 80;
    server_name trafegopro.147.93.10.249.sslip.io www.trafego.pro trafego.pro;

    # Uploads de mídia das publicações vão até 50 MB.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }
}
